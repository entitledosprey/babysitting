services:
  # Named "babysitting", not "app": this container joins the shared edge network
  # below, where the service name becomes a DNS alias. A service called "app"
  # would collide with the alias another stack already publishes there.
  babysitting:
    image: ghcr.io/entitledosprey/babysitting:latest
    container_name: babysitting
    restart: unless-stopped
    # Loopback publish is for host-side debugging only; the edge proxy reaches
    # this container by name over the shared network.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /app/data/babysitting.db
      # The edge proxy terminates TLS, so session cookies are marked Secure.
      SECURE_COOKIES: "true"
    # SMTP credentials and ADMIN_EMAILS live here; see .env.example. Marked
    # optional so the stack still starts on a host that has not configured mail.
    env_file:
      - path: .env
        required: false
    volumes:
      - babysitting-data:/app/data
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  babysitting-data:

networks:
  # The nginx container that owns :80/:443 lives on this network.
  edge:
    external: true
    name: calorie-app_default
