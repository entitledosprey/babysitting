services:
  app:
    image: ghcr.io/entitledosprey/babysitting:latest
    container_name: babysitting
    restart: unless-stopped
    # Bound to loopback only — nginx on the host terminates TLS and proxies in.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /app/data/babysitting.db
      # Session cookies are marked Secure; nginx serves the app over HTTPS.
      SECURE_COOKIES: "true"
    volumes:
      - babysitting-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  babysitting-data:
