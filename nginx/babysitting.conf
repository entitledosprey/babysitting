# babysitting.entitledosprey.com
#
# Install to /etc/nginx/sites-available/babysitting.conf and symlink into
# sites-enabled, then run:
#   sudo certbot --nginx -d babysitting.entitledosprey.com
# Certbot rewrites this file in place to add the TLS listener, certificate
# paths and the port-80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name babysitting.entitledosprey.com;

    # Uploads are small (JSON only); keep the ceiling low.
    client_max_body_size 1m;

    access_log /var/log/nginx/babysitting.access.log;
    error_log  /var/log/nginx/babysitting.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
