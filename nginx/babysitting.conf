# babysitting.entitledosprey.com
#
# The hostname is proxied through Cloudflare (orange cloud), so the origin
# certificate is issued by Let's Encrypt over DNS-01 rather than HTTP-01:
#
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#     -d babysitting.entitledosprey.com
#
# Cloudflare's SSL mode for the zone must be Full (strict) so the edge verifies
# this certificate rather than talking to the origin in the clear.

server {
    listen 80;
    listen [::]:80;
    server_name babysitting.entitledosprey.com;

    # Cloudflare reaches the origin on 443 under Full (strict); anything
    # arriving on 80 is either a stray direct hit or a redirect loop waiting to
    # happen, so send it straight to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name babysitting.entitledosprey.com;

    ssl_certificate     /etc/letsencrypt/live/babysitting.entitledosprey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babysitting.entitledosprey.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Without this every request appears to come from a Cloudflare address,
    # which would collapse the login rate limiter into a single global bucket.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # JSON only; keep the ceiling low.
    client_max_body_size 1m;

    access_log /var/log/nginx/babysitting.access.log;
    error_log  /var/log/nginx/babysitting.error.log;

    # A childcare log should not be indexed or archived.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Always https here: Cloudflare terminates TLS for the client and this
        # block only ever serves the encrypted listener.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
