# babysitting.entitledosprey.com
#
# This server block is appended to the edge nginx that owns :80/:443
# (calorie-app/nginx/nginx.conf). The app itself runs in its own compose stack
# and is reached by container name over the shared calorie-app_default network.
#
# The certificate is issued on the host by certbot via Cloudflare DNS-01 (the
# hostname is proxied, so HTTP-01 cannot reach the origin) and copied into the
# certbot-certs volume by the deploy hook at
# /etc/letsencrypt/renewal-hooks/deploy/babysitting-certs.sh

server {
    listen 80;
    server_name babysitting.entitledosprey.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name babysitting.entitledosprey.com;

    ssl_certificate /etc/letsencrypt/live/babysitting.entitledosprey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babysitting.entitledosprey.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cloudflare proxies this hostname. Scoped to this server block so the
    # neighbouring site's logging and rate limiting are untouched. Without it
    # every visitor would share one address and the app's login throttle would
    # collapse into a single global bucket.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 1m;

    # A childcare log should never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "same-origin" always;
    # style-src allows inline because React sets element style attributes;
    # there are no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://babysitting:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Always https: Cloudflare terminates TLS for the client and this block
        # only serves the encrypted listener.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
